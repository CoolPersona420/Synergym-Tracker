<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Synergym</title>
<meta name="description" content="Synergym is a lifting log that scores the intensity of every set and session, spots supersets and drop sets, tracks your consistency, and lets you share your training split.">
<meta name="theme-color" content="#EEEDE9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#080808" media="(prefers-color-scheme: dark)">
<script src="/theme.js"></script>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Synergym">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Teko:wght@500;600;700&family=Mr+Dafoe&family=Fraunces:ital,opsz,wght,SOFT,WONK@1,9..144,300..800,0..100,0..1&family=Geist+Mono:wght@400;500&display=swap">
</head>
<body>
<div class="app" id="app">
  <nav class="nav" id="nav" aria-label="Main" hidden></nav>
  <main id="view" aria-live="polite"><div class="boot"></div></main>
</div>
<div class="sheet" id="sheet" hidden><div class="scrim" data-act="close"></div><div class="sp" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheet-body"></div></div></div>
<div id="toast" role="status"></div>
<!-- the brush titles' ragged ink edges (style.css: --brush-edge) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><filter id="brush-edge" x="-5%" y="-12%" width="110%" height="124%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency=".05 .9" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
<input type="file" id="imp" accept="application/json,.json" class="sr" tabindex="-1" aria-hidden="true">
<script type="module" src="/src/main.js"></script>
</body>
</html>
